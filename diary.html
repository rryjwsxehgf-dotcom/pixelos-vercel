<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DIARY.exe</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body{background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-mono);margin:0;padding:14px;overflow-y:auto;height:100vh;box-sizing:border-box}
        h2{font-family:var(--font-display);color:var(--neon-purple);letter-spacing:2px;font-size:15px;margin-bottom:14px;border-bottom:1px solid var(--border-glow);padding-bottom:8px;display:flex;justify-content:space-between;align-items:center}
        h2 span{font-size:10px;color:var(--text-dim)}
        .entry{background:rgba(8,8,24,0.6);border:1px solid var(--border-subtle);padding:10px 14px;margin-bottom:6px;font-size:11px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;transition:all 0.3s}
        .entry:hover{border-color:var(--border-glow)}
        .entry-text{flex:1;line-height:1.6;color:var(--text-primary)}
        .entry-meta{font-size:8px;color:var(--text-dim);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
        .entry-tag{display:inline-block;background:rgba(180,77,255,0.2);color:var(--neon-purple);font-size:7px;padding:2px 6px;text-transform:uppercase;letter-spacing:1px}
        .entry-tag.genius{background:rgba(0,255,102,0.2);color:var(--neon-green)}
        .entry-tag.learn{background:rgba(0,212,255,0.2);color:var(--neon-blue)}
        .entry-tag.thought{background:rgba(180,77,255,0.15);color:var(--text-secondary)}
        .delete-btn{background:rgba(255,50,50,0.6);color:#fff;border:none;cursor:pointer;font-size:12px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;clip-path:polygon(20% 0%,80% 0%,100% 50%,80% 100%,20% 100%,0% 50%)}
        .delete-btn:hover{background:rgba(255,0,0,1)}
        .loading{text-align:center;color:var(--text-dim);padding:20px;font-size:11px}
        .pagination{display:flex;justify-content:center;gap:6px;margin-top:10px}
        .pagination button{padding:6px 10px;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);color:var(--text-dim);cursor:pointer;font-family:var(--font-mono);font-size:9px;clip-path:polygon(3px 0%,100% 0%,calc(100% - 3px) 100%,0% 100%)}
        .pagination button:hover{background:rgba(180,77,255,0.2);color:#fff;border-color:var(--neon-purple)}
        .pagination button.active{background:var(--neon-purple);color:#fff;border-color:var(--neon-purple)}
    </style>
</head>
<body>
    <h2>📓 ERIC'S DIARY <span id="entryCount"></span></h2>
    <div id="diaryContent"><div class="loading">LOADING...</div></div>
    <div class="pagination" id="pagination"></div>
<script>
let currentPage=0,perPage=10;
async function loadDiary(page=0){
    currentPage=page;document.getElementById('diaryContent').innerHTML='<div class="loading">LOADING...</div>';
    try{
        const r=await fetch(`/api/diary?limit=${perPage}&offset=${page*perPage}`);const d=await r.json();
        if(d.status!=='success'){document.getElementById('diaryContent').innerHTML='<div class="loading">ERROR</div>';return}
        document.getElementById('entryCount').textContent=`${d.total} записей`;
        let h='';
        d.entries.forEach(e=>{
            const tags=e.tags?e.tags.split(',').map(t=>`<span class="entry-tag ${t.trim()}">${t.trim()}</span>`).join(''):'';
            const typeClass=e.type||'thought';
            h+=`<div class="entry" id="entry-${e.id}"><div style="flex:1"><div class="entry-text">${e.entry}</div><div class="entry-meta">${e.timestamp}${tags}<span class="entry-tag ${typeClass}">${typeClass}</span></div></div><button class="delete-btn" onclick="deleteEntry(${e.id})" title="Удалить">✕</button></div>`;
        });
        document.getElementById('diaryContent').innerHTML=h||'<div class="loading">EMPTY</div>';
        let pag='',totalPages=Math.ceil(d.total/perPage);
        for(let i=0;i<totalPages;i++){pag+=`<button class="${i===currentPage?'active':''}" onclick="loadDiary(${i})">${i+1}</button>`}
        document.getElementById('pagination').innerHTML=pag;
    }catch(e){document.getElementById('diaryContent').innerHTML='<div class="loading">CONNECTION LOST</div>'}
}
async function deleteEntry(id){
    if(!confirm('Удалить запись?'))return;
    try{await fetch(`/api/diary/${id}`,{method:'DELETE'});const el=document.getElementById('entry-'+id);if(el){el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300)}}catch(e){}
}
loadDiary(0);
</script>
</body>
</html>
