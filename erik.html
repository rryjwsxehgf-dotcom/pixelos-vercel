<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TERMINAL // ERIKA_CHAT</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex; flex-direction: column;
            background: var(--bg-deep);
        }

        .chat-header {
            flex-shrink: 0;
            padding: 14px 18px;
            background: rgba(8, 8, 24, 0.9);
            border-bottom: 1px solid var(--border-glow);
            display: flex; align-items: center; gap: 12px;
            font-family: var(--font-display);
        }

        .chat-header .status-dot {
            width: 10px; height: 10px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: neonPulse 2s infinite;
        }

        .chat-header .title {
            font-size: 14px; font-weight: 700;
            letter-spacing: 2px;
            color: var(--neon-purple);
        }

        .chat-header .subtitle {
            font-size: 10px; color: var(--text-dim);
            letter-spacing: 1px; margin-left: auto;
        }

        /* Терминал */
        .terminal-wrap {
            flex: 1; overflow-y: auto;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.8;
            background: rgba(0, 0, 0, 0.6);
        }

        .msg-user {
            color: #ffffff;
            margin-bottom: 8px;
            padding: 2px 0;
        }

        .msg-user::before {
            content: '┌─[user@erik]─[$] ';
            color: var(--neon-purple);
            font-weight: 600;
        }

        .msg-erik {
            color: var(--neon-green);
            margin-bottom: 8px;
            padding: 2px 0;
        }

        .msg-erik::before {
            content: '└─[erik@ai]─[#] ';
            color: var(--neon-cyan);
            font-weight: 600;
        }

        .thinking {
            color: var(--text-dim);
            font-style: italic;
            margin-bottom: 8px;
        }

        .thinking::after {
            content: '▌';
            color: var(--neon-green);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Поле ввода */
        .chat-input-bar {
            flex-shrink: 0;
            padding: 12px 14px;
            background: rgba(8, 8, 24, 0.9);
            border-top: 1px solid var(--border-glow);
            display: flex; gap: 10px;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            border-radius: 2px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
        }

        .chat-input-bar input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(180, 77, 255, 0.2);
        }

        .chat-input-bar input::placeholder {
            color: var(--text-dim);
        }

        .send-btn {
            padding: 12px 20px;
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            background: transparent;
            border: 1px solid var(--neon-purple);
            color: var(--neon-purple);
            cursor: pointer;
            clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: rgba(180, 77, 255, 0.15);
            box-shadow: 0 0 12px rgba(180, 77, 255, 0.3);
        }

        .send-btn:active {
            transform: scale(0.94);
        }
    
        
        .photo-btn:hover { background: rgba(180,77,255,0.3); }
        


        .copy-btn {
            background: rgba(180,77,255,0.15);
            border: 1px solid var(--border-glow);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 10px;
            padding: 2px 8px;
            margin-left: 8px;
            clip-path: polygon(3px 0%, 100% 0%, calc(100% - 3px) 100%, 0% 100%);
            transition: all 0.2s;
        }
        .copy-btn:hover { background: rgba(180,77,255,0.3); color: #fff; }
        .copy-btn.copied { background: var(--neon-green); color: #000; }

</style>
</head>
<body>

    <div class="chat-header">
        <div class="status-dot"></div>
        <span class="title">ERIKA_CHAT.exe</span>
        <span class="subtitle" id="statusLabel">CONNECTED</span><span class="subtitle" id="timeLabel" style="margin-left:12px"></span>
    </div>

    <div class="terminal-wrap" id="chatMessages">
        <div class="msg-erik">Привет. Я Эрик. Кофе в чашке, дождь за окном. Спрашивай.</div>
        <div class="thinking" id="thinking" style="display:none;">processing</div>
    </div>

    <div class="chat-input-bar">
        
        

        <input type="text" id="chatInput" placeholder="> _ введи сообщение..." autocomplete="off">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>

<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const thinking = document.getElementById('thinking');
const statusLabel = document.getElementById('statusLabel');

chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
chatInput.focus();

// Обновление времени
function updateTime() {
    const now = new Date();
    const time = now.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
    document.getElementById('timeLabel').textContent = '🕐 ' + time;
}
updateTime();
setInterval(updateTime, 30000);

let thinkingTimer = null;

function addMsg(text, type) {
    const div = document.createElement('div');
    div.className = type === 'user' ? 'msg-user' : 'msg-erik';
    
    const span = document.createElement('span');
    span.textContent = text;
    div.appendChild(span);
    
    // Кнопка копирования для сообщений Эрика
    if (type === 'erik') {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = '📋';
        copyBtn.title = 'Копировать';
        copyBtn.onclick = function() {
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = '✅';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '📋';
                    copyBtn.classList.remove('copied');
                }, 1500);
            });
        };
        div.appendChild(copyBtn);
    }
    
    chatMessages.insertBefore(div, thinking);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    addMsg(text, 'user');
    chatInput.value = '';
    sendBtn.disabled = true;
    chatInput.disabled = true;

    thinking.style.display = 'block';
    statusLabel.textContent = 'PROCESSING...';
    chatMessages.scrollTop = chatMessages.scrollHeight;

    try {
        const r = await fetch('/api/erik/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
        const d = await r.json();
        thinking.style.display = 'none';
        statusLabel.textContent = 'CONNECTED';

        if (d.status === 'success') {
            addMsg(d.reply, 'erik');
        } else {
            addMsg('[!] ' + (d.message || 'Error'), 'erik');
        }
    } catch {
        thinking.style.display = 'none';
        statusLabel.textContent = 'DISCONNECTED';
        addMsg('[!] Connection lost', 'erik');
    }

    sendBtn.disabled = false;
    chatInput.disabled = false;
    chatInput.focus();

// Обновление времени
function updateTime() {
    const now = new Date();
    const time = now.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
    document.getElementById('timeLabel').textContent = '🕐 ' + time;
}
updateTime();
setInterval(updateTime, 30000);
}

async function sendPhoto() {
    const file = document.getElementById('photoInput').files[0];
    if (!file) return;
    
    addMsg('📷 Отправляю фото...', 'user');
    
    const reader = new FileReader();
    reader.onload = async function(e) {
        const base64 = e.target.result.split(',')[1];
        
        thinking.style.display = 'block';
        statusLabel.textContent = 'ANALYZING PHOTO...';
        
        try {
            const r = await fetch('/api/erik/photo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64, caption: 'Опиши что на этом фото подробно. Что за объект, цвет, форма, текст если есть.' })
            });
            const d = await r.json();
            thinking.style.display = 'none';
            statusLabel.textContent = 'CONNECTED';
            
            if (d.status === 'success') {
                addMsg(d.reply, 'erik');
            } else {
                addMsg('[!] Не вижу ни черта. Либо фото дрянь, либо сервер лёг.', 'erik');
            }
        } catch {
            thinking.style.display = 'none';
            statusLabel.textContent = 'CONNECTED';
            addMsg('[!] Ошибка отправки', 'erik');
        }
    };
    reader.readAsDataURL(file);
    document.getElementById('photoInput').value = '';
}

</script>
</body>
</html>
