<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelOS — Эрик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e0e0e0; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px 20px; background: #12121a; border-bottom: 1px solid #222; text-align: center; font-weight: bold; font-size: 1.2rem; color: #a855f7; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; }
        .user { align-self: flex-end; background: #2563eb; color: #fff; }
        .bot { align-self: flex-start; background: #1f1f2e; color: #ddd; border: 1px solid #333; }
        footer { padding: 15px; background: #12121a; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a26; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; outline: none; }
        button { background: #a855f7; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>PixelOS // Эрик</header>
    <div id="chat">
        <div class="msg bot">Задавай вопрос. Только без лишней воды.</div>
    </div>
    <footer>
        <input type="text" id="input" placeholder="Напиши сообщение..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Отправить</button>
    </footer>
    <script>
        async function send() {
            const inp = document.getElementById('input');
            const txt = inp.value.trim();
            if(!txt) return;
            
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg user">${txt}</div>`;
            inp.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: txt })
                });
                const data = await res.json();
                chat.innerHTML += `<div class="msg bot">${data.reply || '...' }</div>`;
            } catch(e) {
                chat.innerHTML += `<div class="msg bot">Ошибка сети.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
